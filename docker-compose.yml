version: '3.8'

services:
  logger:
    build: ./logger
    environment:
      TZ: Asia/Tokyo
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./config.json
        target: /app/config.json

  viewer:
    build: ./viewer
    environment:
      TZ: Asia/Tokyo
    ports:
      - 8080:80
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./config.json
        target: /app/config.json

  mariadb:
    image: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required}
      MYSQL_USER: switchbot-logger
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_DATABASE: switchbot-logger
      TZ: Asia/Tokyo
    healthcheck:
      test: ["CMD-SHELL", 'mariadb-admin ping -h localhost -uroot -p"$$MARIADB_ROOT_PASSWORD"']
      timeout: 20s
      interval: 5s
      retries: 30
    volumes:
      - type: bind
        source: ./db-data/
        target: /var/lib/mysql
